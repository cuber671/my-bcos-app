[common]
    cryptoType = 0 # 0为标准ECDSA，1为国密SM

[network]
    # 使用 HTTP RPC 端口
    peers = [
        "fisco-node0:20000",
        "fisco-node1:20001",
        "fisco-node2:20002",
        "fisco-node3:20003"
    ]
    defaultGroup = "group0"

[cryptoMaterial]
    certPath = "/app/sdk"
    disableSsl = "true"

[threadPool]
    maxBlockingQueueSize = 1000

[account]
    # 使用相对路径 account（SDK 会追加 ecdsa/ 子目录）
    keyStoreDir = "account"
    accountAddress = "0x6976c14175ddfae575ffab3845d89e155e09569d"
    accountFileFormat = "pem"
