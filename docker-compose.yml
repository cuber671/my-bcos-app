# Docker Compose 配置文件 - Java 后端 + MySQL + FISCO节点 + 控制台
# 开发环境使用：docker-compose up -d
# 注意：环境变量优先从 .env 文件读取

services:
  # =====================================================
  # 1. FISCO BCOS 节点 0
  # =====================================================
  fisco-node0:
    image: fiscoorg/fiscobcos:v3.12.1
    container_name: fisco-node0
    restart: always
    ports:
      - "20000:20000"  # RPC
      - "30300:30300"  # P2P
      - "30400:30400"  # Channel (WebSocket)
    volumes:
      - ./fisco/nodes/127.0.0.1/node0:/data/node
    working_dir: /data/node
    command: ["-c", "config.ini", "-g", "config.genesis"]
    networks:
      fisco-net:
        ipv4_address: 172.25.0.10

  # =====================================================
  # 2. FISCO BCOS 节点 1
  # =====================================================
  fisco-node1:
    image: fiscoorg/fiscobcos:v3.12.1
    container_name: fisco-node1
    restart: always
    ports:
      - "20001:20001"  # RPC
      - "30301:30301"  # P2P
      - "30401:30401"  # Channel (WebSocket)
    volumes:
      - ./fisco/nodes/127.0.0.1/node1:/data/node
    working_dir: /data/node
    command: ["-c", "config.ini", "-g", "config.genesis"]
    networks:
      fisco-net:
        ipv4_address: 172.25.0.11

  # =====================================================
  # 3. FISCO BCOS 节点 2
  # =====================================================
  fisco-node2:
    image: fiscoorg/fiscobcos:v3.12.1
    container_name: fisco-node2
    restart: always
    ports:
      - "20002:20002"  # RPC
      - "30302:30302"  # P2P
      - "30402:30402"  # Channel (WebSocket)
    volumes:
      - ./fisco/nodes/127.0.0.1/node2:/data/node
    working_dir: /data/node
    command: ["-c", "config.ini", "-g", "config.genesis"]
    networks:
      fisco-net:
        ipv4_address: 172.25.0.12

  # =====================================================
  # 4. FISCO BCOS 节点 3
  # =====================================================
  fisco-node3:
    image: fiscoorg/fiscobcos:v3.12.1
    container_name: fisco-node3
    restart: always
    ports:
      - "20003:20003"  # RPC
      - "30303:30303"  # P2P
      - "30403:30403"  # Channel (WebSocket)
    volumes:
      - ./fisco/nodes/127.0.0.1/node3:/data/node
    working_dir: /data/node
    command: ["-c", "config.ini", "-g", "config.genesis"]
    networks:
      fisco-net:
        ipv4_address: 172.25.0.13

  # =====================================================
  # 5. FISCO 控制台（使用 OpenJDK 运行控制台程序）
  # =====================================================
  fisco-console:
    image: eclipse-temurin:11-jre-focal
    container_name: fisco-console
    restart: always
    tty: true
    stdin_open: true
    working_dir: /data
    depends_on:
      - fisco-node0
      - fisco-node1
      - fisco-node2
      - fisco-node3
    volumes:
      - ./console:/data
    command: ["bash", "-c", "cd /data && java -cp 'apps/*:conf/:lib/*:classes/' console.Console group0"]
    networks:
      - fisco-net

  # =====================================================
  # 6. MySQL 数据库
  # =====================================================
  fisco-dev-db:
    image: mysql:8.0.36
    container_name: fisco-dev-db
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME:-fisco_data}
      - MYSQL_USER=${DB_USERNAME:-fisco_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-123456}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_pwd}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fisco-net

  # =====================================================
  # 7. Java 应用程序
  # =====================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fisco-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:-fisco-dev-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-fisco_data}
      - DB_USERNAME=${DB_USERNAME:-fisco_user}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - FISCO_ENABLED=${FISCO_ENABLED:-true}
      - FISCO_CONFIG_FILE=${FISCO_CONFIG_FILE:-/app/sdk/config.toml}
      - FISCO_GROUP=${FISCO_GROUP:-group0}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7200000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - CONTRACT_ENTERPRISE=${CONTRACT_ENTERPRISE}
      - CONTRACT_WAREHOUSE_CORE=${CONTRACT_WAREHOUSE_CORE}
      - CONTRACT_WAREHOUSE_OPS=${CONTRACT_WAREHOUSE_OPS}

      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/config:/app/config
      - ./docker/logs:/app/logs
      - ./docker/data:/app/data
      - ./fisco/nodes/127.0.0.1/sdk:/app/sdk
    depends_on:
      fisco-dev-db:
        condition: service_healthy
      fisco-node0:
        condition: service_started
      fisco-node1:
        condition: service_started
      fisco-node2:
        condition: service_started
      fisco-node3:
        condition: service_started
    networks:
      - fisco-net

volumes:
  mysql-data:

networks:
  fisco-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
